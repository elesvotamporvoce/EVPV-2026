name: Rodar tarefa (sob demanda)

# Painel único para rodar qualquer script do projeto SEM precisar do seu
# computador: Actions > "Rodar tarefa" > Run workflow > escolha na lista.
on:
  workflow_dispatch:
    inputs:
      tarefa:
        description: "O que rodar"
        required: true
        type: choice
        default: licencas
        options:
          - licencas                 # períodos de licença (conserta a ausência)
          - candidatos_novos_rapido  # TSE: candidatos sem histórico (sem patrimônio)
          - candidatos_novos_completo
          - tse_parlamentares        # atualiza candidatura dos parlamentares atuais
          - scores                   # recalcula os agreement scores
          - integridade              # checagem de integridade dos dados
      dry_run:
        description: "Só simular, sem gravar (vale para licenças)"
        required: false
        type: boolean
        default: false

concurrency:
  group: tarefa-sob-demanda
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # v5/v6 rodam em Node 24. As versões antigas (checkout@v4, setup-python@v5)
      # ainda funcionam, mas o runner avisa que o Node 20 foi descontinuado.
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r ingest/requirements.txt

      # Este passo NUNCA imprime o secret: so diz QUAL parte da string esta
      # errada. A checagem usa o parse do proprio libpq (parse_dsn), que e o
      # que o driver realmente faz — o urlparse do Python mente em alguns
      # casos (senha com @, por exemplo).
      - name: Conferir o banco antes de comecar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os, sys

          dsn = os.environ.get("DATABASE_URL", "")

          def erro(msg):
              print("::error::" + msg)
              sys.exit(1)

          if not dsn.strip():
              erro("O secret DATABASE_URL nao existe ou esta vazio. Va em Settings > "
                   "Secrets and variables > Actions e crie um secret chamado exatamente "
                   "DATABASE_URL.")

          if "[YOUR-PASSWORD]" in dsn:
              erro("Voce copiou o modelo do painel sem trocar [YOUR-PASSWORD] pela senha real.")

          if not dsn.startswith(("postgresql://", "postgres://")):
              erro("A string nao comeca com postgresql:// . Provavelmente foi colada so a "
                   "senha, ou so o endereco. Pegue a URI inteira em Supabase > Connect.")

          from psycopg2.extensions import parse_dsn
          try:
              p = parse_dsn(dsn)
          except Exception as e:
              linha = str(e).strip().splitlines()[0]
              if "percent-encoded" in linha:
                  erro("A senha tem um % solto. Na URL, % precisa virar %25. " + linha)
              erro("Nao consegui interpretar a string: " + linha)

          host = p.get("host", "")
          if not host:
              erro("A string tem o prefixo certo mas nao tem endereco de banco depois do @. "
                   "Formato: postgresql://postgres:SENHA@db.SEUREF.supabase.co:5432/postgres")

          # Este e o caso silencioso: com @ ou / na senha, o libpq corta a senha no
          # primeiro @ e o resto vira parte do host. O host fica com cara errada.
          if "@" in host:
              erro("A SENHA tem um @ sem escapar. O driver corta a senha no primeiro @ e "
                   "o resto vira endereco (host ficou '" + host + "'). Troque o @ da senha "
                   "por %40 na string, ou gere a string de novo com a senha ja codificada.")
          if host in ("postgres", "localhost") or "." not in host:
              erro("O host ficou '" + host + "', que nao parece o endereco do Supabase. "
                   "Se a senha tem / ou :, ela precisa ser codificada (/ vira %2F).")

          print("formato ok - host %s porta %s usuario %s" % (host, p.get("port", 5432), p.get("user", "?")))

          import psycopg2
          try:
              c = psycopg2.connect(dsn, connect_timeout=15)
          except Exception as e:
              linha = str(e).strip().splitlines()[0]
              if "Network is unreachable" in linha or "could not translate host name" in linha:
                  erro("A string esta certa, mas o runner do GitHub nao alcanca esse host: " + linha +
                       " -- use a string do Session pooler (Supabase > Connect > Session pooler): "
                       "a conexao direta do Supabase e IPv6 e o runner so tem IPv4.")
              erro("A string esta bem formada mas a conexao falhou: " + linha)
          cur = c.cursor(); cur.execute("select count(*) from person")
          print("conexao ok - %d parlamentares no banco" % cur.fetchone()[0])
          c.close()
          PY

      - name: Rodar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TAREFA: ${{ github.event.inputs.tarefa }}
          DRY: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          case "$TAREFA" in
            licencas)
              if [ "$DRY" = "true" ]; then
                python scripts/update_afastamentos.py --dry-run
              else
                python scripts/update_afastamentos.py
              fi ;;
            candidatos_novos_rapido)
              python scripts/ingest_candidatos_novos.py --sem-bens ;;
            candidatos_novos_completo)
              python scripts/ingest_candidatos_novos.py ;;
            tse_parlamentares)
              python scripts/ingest_tse_2026.py ;;
            scores)
              python scoring/score.py ;;
            integridade)
              python scripts/check_integrity.py ;;
            *) echo "::error::tarefa desconhecida: $TAREFA"; exit 1 ;;
          esac

      - name: Derrubar o cache do site
        if: success()
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -z "${REVALIDATE_SECRET:-}" ]; then
            echo "::warning::REVALIDATE_SECRET nao configurado; o cache das paginas estaticas expira sozinho em ate 15 min."
            exit 0
          fi
          curl -fsS "https://www.elesvotamporvoce.org/api/revalidate?secret=${REVALIDATE_SECRET}" \
            && echo "" && echo "Cache revalidado."
